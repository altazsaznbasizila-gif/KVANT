<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта на знания</title>
    <link rel="stylesheet" href="skill.css">
</head>
<body>

<div class="map-container" style="background-image: url('skillbackground.png');">
    <h1 class="main-title">Твоят Път към Знанието</h1>

    <div class="skill-tree">
        <div class="skill-node unlocked" data-title="Основи на Механиката">
            <img src="../Images/skill_unlock.png" class="node-img">
            <span class="label">Основи</span>
        </div>

        <div class="skill-node unlocked" data-title="Скорост и Време">
            <img src="../Images/skill_unlock.png" class="node-img">
            <span class="label">Скорост</span>
        </div>

        <div class="skill-node locked" data-title="Закон на Ом">
            <img src="../Images/skill_lock.png" class="node-img">
            <span class="label">Закон на Ом</span>
        </div>
    </div>


    <div class="robot-guide">
        <div class="speech-bubble">
            <img src="boxtitle_down.png" class="bubble-tip">
            <p id="robot-text">Здравей! Готов ли си да отключим тайните на Вселената днес?</p>
        </div>
        <img src="../Images/robot.png" alt="Robot" class="robot-img">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
